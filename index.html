<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第37屆金曲獎 - 我的專屬預測排名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #121212;
            color: #ffffff;
            background-image: radial-gradient(circle at 80% 20%, #2a3441 0%, #121212 50%);
            background-attachment: fixed;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sortable-ghost { opacity: 0.4; transform: scale(0.95); }

        .card-mask {
            opacity: 0;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            transition: opacity 0.2s ease;
        }
        .group:hover .card-mask { opacity: 1; }

        .hover-info { opacity: 0; transition: opacity 0.2s ease; }
        .group:hover .hover-info { opacity: 1; }

        .exporting .nominee-card { border: none !important; }
        .exporting .hide-on-export { display: none !important; }
        .exporting .hover-info { display: none !important; }

        .exporting:not(.no-masks) .card-mask {
            opacity: 1 !important;
            background-color: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(2px) !important;
        }
        
        .show-on-export { display: none; }
        .exporting:not(.no-masks) .show-on-export { display: flex !important; }
        
        .exporting .rank-number { 
            color: #ffffff; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
        }

        .exclude-from-export { display: none !important; }

        #exportModal { display: none; opacity: 0; transition: opacity 0.2s ease-in-out; }
        #exportModal.active { display: flex; opacity: 1; }
        .custom-checkbox { accent-color: #4b5563; width: 1.2rem; height: 1.2rem; cursor: pointer; }
    </style>
</head>

                </button>
            </div>
            
            <div class="px-6 py-4 overflow-y-auto hide-scrollbar flex-1">

            { id: 10, category: "演奏類 最佳作曲人獎", items: [{ name: "錢威良", artist: "Harsanik" }, { name: "黃令先", artist: "<春/ Spring>" }, { name: "蘇郁涵", artist: "Pieces Peace 碎碎平安" }, { name: "黃瑞豐、吳政君", artist: "金" }, { name: "李軍", artist: "居住正義" }, { name: "Nelson Thomas Ny-Devereaux", artist: "rentfree" }] },
            { id: 13, category: "最佳專輯製作人獎", items: [{ name: "蕭賀碩", artist: "來了" }, { name: "鶴 The Crane", artist: "Same Stories, Different Narratives" }, { name: "王昱辰、曾國宏", artist: "QUIT QUIETLY" }, { name: "JOLIN 蔡依林、陳星翰", artist: "Pleasure" }, { name: "裘德、Tonyi NG", artist: "離開銀色荒原" }, { name: "常石磊", artist: "純妹妹" }] },
            { id: 14, category: "演奏類 最佳專輯製作人獎", items: [{ name: "蘇郁涵", artist: "Over The Moons" }, { name: "Oberka", artist: "Regrow Protocol" }, { name: "丁可", artist: "長夜將盡電影原聲音樂" }, { name: "大恭", artist: "心之歸途" }, { name: "黃瑞豐、吳政君", artist: "傳奇・雙擊 ─ 新視界" }] },

            { id: 22, category: "最佳演唱組合獎", items: [{ name: "頑童 MJ116", artist: "OGS" }, { name: "GENBLUE 幻藍小熊", artist: "MIRROR" }, { name: "凹與山", artist: "Hidden Album" }, { name: "椅子樂團", artist: "愛的對白" }, { name: "Dac & 鄭昭元", artist: "Enough" }] },
            { id: 23, category: "最佳華語男歌手獎", items: [{ name: "張震嶽", artist: "跟著感覺走" }, { name: "周湯豪", artist: "LOVE RAGE HOPE" }, { name: "盧廣仲", artist: "HeartBreakFast" }, { name: "Gummy B", artist: "更好" }, { name: "裘德", artist: "離開銀色荒原" }] },
            { id: 24, category: "最佳華語女歌手獎", items: [{ name: "洪佩瑜", artist: "開" }, { name: "陳嫺靜", artist: "如果每天都可以..." }, { name: "彭佳慧", artist: "完整的大人" }, { name: "JOLIN 蔡依林", artist: "Pleasure" }, { name: "劉艾立", artist: "雙魚宮" }, { name: "單依純", artist: "純妹妹" }] },
            { id: 25, category: "最佳華語專輯獎", items: [{ name: "開", artist: "何樂音樂" }, { name: "OGS", artist: "滾石國際音樂" }, { name: "跟著感覺走", artist: "滾石國際音樂" }, { name: "Pleasure", artist: "華納國際音樂" }, { name: "離開銀色荒原", artist: "亞神音樂" }, { name: "純妹妹", artist: "禾聲文化" }] },
            { id: 26, category: "年度歌曲獎", items: [{ name: "三菜一湯 In the Middle", artist: "演唱：楊世暄" }, { name: "浪人的...", artist: "演唱：張震嶽" }, { name: "Pleasure", artist: "演唱：JOLIN 蔡依林" }, { name: "老翅膀", artist: "演唱：陳小霞" }, { name: "如果每天都可以 happy happy...", artist: "演唱：陳嫺靜" }, { name: "我的存在就是愛你", artist: "演唱：aMEI" }, { name: "幸福在歌唱", artist: "演唱：A-Lin" }] }
        ];

        const imageExtension = ".jpg"; 

        awardsData.forEach((award) => {
            const a = award.id; 
            award.items.forEach((item, nomineeIndex) => {
                const b = nomineeIndex + 1;
                item.imgUrl = `./cover/${a}-${b}${imageExtension}`; 
            });
        });

        const container = document.getElementById('categoriesContainer');
        const modalChecklist = document.getElementById('modalChecklist');

        function renderUI() {
            awardsData.forEach((award, awardIndex) => {
                const section = document.createElement('div');
                section.className = "award-section flex flex-col gap-4 transition-all duration-300";
                section.setAttribute('data-index', awardIndex);
                
                const title = document.createElement('h2');
                title.className = "text-xl font-bold tracking-widest pl-2 border-l-4 border-gray-500 text-gray-200";
                title.innerText = award.category;
                section.appendChild(title);

                const sortableList = document.createElement('div');
                sortableList.className = "flex gap-4 overflow-x-auto py-4 hide-scrollbar sortable-row";

                award.items.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = "nominee-card relative flex-shrink-0 w-36 h-36 rounded-lg overflow-hidden cursor-grab shadow-lg transition-transform hover:-translate-y-1 bg-gray-900 group";
                    
                    const safeName = item.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    
                    card.innerHTML = `
                        <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 flex flex-col items-center justify-center p-3 text-center z-0">
                            <span class="font-bold text-sm text-gray-100 line-clamp-2 leading-tight">${safeName}</span>
                            <span class="text-xs text-gray-400 mt-2 line-clamp-2">${item.artist}</span>
                        </div>
                        <img src="${item.imgUrl}" class="absolute inset-0 w-full h-full object-cover z-10" alt="${item.name}" onerror="this.style.display='none'">
                        <div class="card-mask absolute inset-0 pointer-events-none z-20"></div>
                        <div class="hover-info absolute inset-0 flex flex-col items-center justify-center p-3 text-center pointer-events-none z-30">
                            <span class="font-bold text-sm text-white drop-shadow-md line-clamp-3 leading-tight">${safeName}</span>
                            <span class="text-xs text-gray-300 mt-2 drop-shadow-md line-clamp-2">${item.artist}</span>
                        </div>
                        <div class="show-on-export absolute inset-0 flex-col items-center justify-center pointer-events-none z-30">
                            <span class="rank-number text-5xl font-black transition-transform">${idx + 1}</span>
                        </div>
                        <div class="absolute top-2 left-2 w-6 h-6 bg-black/60 rounded-full flex items-center justify-center text-xs font-bold text-gray-200 hide-on-export indicator-num z-30">${idx + 1}</div>
                    `;
                    sortableList.appendChild(card);
                });

                section.appendChild(sortableList);
                container.appendChild(section);

                new Sortable(sortableList, {
                    animation: 200,
                    ghostClass: 'sortable-ghost',
                    onEnd: function () { updateRanks(sortableList); }
                });

                const label = document.createElement('label');
                label.className = "flex items-center gap-3 p-2 hover:bg-gray-800 rounded cursor-pointer transition-colors";
                label.innerHTML = `
                    <input type="checkbox" checked value="${awardIndex}" class="custom-checkbox category-checkbox">
                    <span class="text-gray-300 text-sm">${award.category}</span>
                `;
                modalChecklist.appendChild(label);
            });
        }

        function updateRanks(rowElement) {
            const cards = rowElement.querySelectorAll('.nominee-card');
            cards.forEach((card, index) => {
                const rankNum = index + 1;
                card.querySelector('.rank-number').innerText = rankNum;
                card.querySelector('.indicator-num').innerText = rankNum;
            });
        }

        const modal = document.getElementById('exportModal');
        document.getElementById('openModalBtn').addEventListener('click', () => modal.classList.add('active'));
        const closeModal = () => modal.classList.remove('active');
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelExportBtn').addEventListener('click', closeModal);

        let isAllSelected = true;
        document.getElementById('selectAllBtn').addEventListener('click', () => {
            isAllSelected = !isAllSelected;
            document.querySelectorAll('.category-checkbox').forEach(cb => cb.checked = isAllSelected);
        });

        document.getElementById('confirmExportBtn').addEventListener('click', async () => {
            const confirmBtn = document.getElementById('confirmExportBtn');
            const captureArea = document.getElementById('captureArea');
            const watermark = document.getElementById('watermark');
            
            const checkboxes = Array.from(document.querySelectorAll('.category-checkbox'));
            const selectedCount = checkboxes.filter(cb => cb.checked).length;
            if(selectedCount === 0) {
                alert("請至少選擇一個要匯出的獎項！");
                return;
            }

            const originalText = confirmBtn.innerHTML;
            confirmBtn.innerHTML = `<svg class="animate-spin w-4 h-4 mr-2 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4"></circle><path d="M12 2a10 10 0 0110 10" stroke-width="4"></path></svg> 處理中...`;
            confirmBtn.disabled = true;

            checkboxes.forEach(cb => {
                const section = document.querySelector(`.award-section[data-index="${cb.value}"]`);
                if (!cb.checked) {
                    section.classList.add('exclude-from-export');
                } else {
                    section.classList.remove('exclude-from-export');
                }
            });

            const applyMask = document.getElementById('toggleMask').checked;
            if (!applyMask) {
                captureArea.classList.add('no-masks');
            }

            captureArea.classList.add('exporting');
            captureArea.style.padding = '40px'; 
            captureArea.style.backgroundColor = '#121212'; 
            watermark.classList.remove('hidden');

            closeModal();
            await new Promise(resolve => setTimeout(resolve, 300));

            try {
                const canvas = await html2canvas(captureArea, {
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: '#121212',
                    windowWidth: document.documentElement.offsetWidth,
                    onclone: function (clonedDoc) {
                        const rows = clonedDoc.querySelectorAll('.sortable-row');
                        rows.forEach(row => {
                            row.style.overflowX = 'visible';
                            row.style.display = 'flex';
                            row.style.flexWrap = 'wrap'; 
                        });
                    }
                });

                const link = document.createElement('a');
                link.download = 'GMA37_My_Prediction.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error("截圖失敗:", error);
                alert("圖片匯出失敗，請重試！");
            } finally {
                captureArea.classList.remove('exporting', 'no-masks');
                captureArea.style.padding = '';
                captureArea.style.backgroundColor = '';
                watermark.classList.add('hidden');
                
                document.querySelectorAll('.award-section').forEach(sec => sec.classList.remove('exclude-from-export'));
                
                confirmBtn.innerHTML = originalText;
                confirmBtn.disabled = false;
            }
        });

        renderUI();
    </script>
</body>
</html>
